<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caregiver Dashboard - Alzheimer's Helper</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
    <link rel=""manifest" href=""manifest.json">
</head>
<body>
    <header>
        <h1>Caregiver Dashboard</h1>
        <nav aria-label="Main Navigation">
            <a href="index.html">Switch to Patient View</a>
        </nav>
    </header>

    <main>
        <section aria-labelledby="add-reminder-heading">
            <h2 id="add-reminder-heading">Add New Reminder</h2>
            
            <form id="add-reminder-form" aria-label="Add reminder form">
                <div class="form-group">
                    <label for="reminder-title">Title</label>
                    <input 
                        type="text" 
                        id="reminder-title" 
                        name="title" 
                        required 
                        placeholder="e.g., Take Morning Pills"
                        aria-required="true"
                    >
                </div>

                <div class="form-group">
                 <input
  type="text"
  id="reminder-time"
  name="time"
  pattern="[0-9]{2}:[0-9]{2}"
  placeholder="HH:MM (e.g., 08:00)"
  required
  aria-required="true"
>
            
                                       <div class="form-group">
                    <label for="reminder-type">Type</label>
                    <select id="reminder-type" name="type" required aria-required="true">
                        <option value="medication">Medication</option>
                        <option value="event">Event</option>
                        <option value="appointment">Appointment</option>
                    </select>
                </div>

                <button type="submit" id="add-reminder-btn">Add Reminder</button>
            </form>
        </section>

        <section aria-labelledby="existing-reminders-heading">
            <h2 id="existing-reminders-heading">Existing Reminders</h2>
            <ul id="reminder-list" aria-live="polite" aria-label="List of active reminders">
                <!-- Reminders will be dynamically populated by caregiver.js -->
            </ul>
        </section>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/reminders.js"></script>
    <script src="js/caregiver.js"></script>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .then(reg => console.log('Service Worker registered!', reg))
        .catch(err => console.error('Service Worker failed:', err));
    });
  }
</script>
</body>
</html>
